version: "3.9"

networks:
  app_net:
    driver: bridge
  payments_net:
    driver: bridge

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres-core:
    image: postgres:16-alpine
    networks: [app_net]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_secret
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./services/core-api/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payments:
    image: postgres:16-alpine
    networks: [app_net, payments_net]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_secret
      POSTGRES_DB: payments_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
      - ./services/payment-service/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [app_net]
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Application Services ────────────────────────────────────────────────────

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    networks: [app_net]
    ports:
      - "3000:3000"
    env_file:
      - ./services/core-api/.env
    environment:
      DATABASE_URL: postgres://core:core_secret@postgres-core:5432/core_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PAYMENT_SERVICE_URL: http://payment-service:3002
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/tmp/fake-firebase.json}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    # Payments isolated to its own network segment + main net
    networks: [app_net, payments_net]
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://payments:payments_secret@postgres-payments:5432/payments_db
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_ScTCKAa5bMjNUU}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-QXy6WTxOHqOaVSeEXqwyhYLo}
    depends_on:
      postgres-payments:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    networks: [app_net]
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_core_data:
  postgres_payments_data:
  redis_data:
