version: "3.9"

networks:
  app_net:
    driver: bridge
  payments_net:
    driver: bridge

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres-core:
    image: postgres:16-alpine
    networks: [app_net]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_secret
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./services/core-api/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payments:
    image: postgres:16-alpine
    networks: [app_net, payments_net]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_secret
      POSTGRES_DB: payments_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
      - ./services/payment-service/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [app_net]
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    networks: [app_net]
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=OpenSearch_2024!
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sfu admin:OpenSearch_2024! http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks: [app_net]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks: [app_net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Application Services ────────────────────────────────────────────────────

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    networks: [app_net]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://core:core_secret@postgres-core:5432/core_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
      # Read from host environment (set via services/core-api/.env or shell export)
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/tmp/fake-firebase.json}
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    networks: [app_net]
    ports:
      - "3001:3001"
    environment:
      OPENSEARCH_URL: http://admin:OpenSearch_2024!@opensearch:9200
      KAFKA_BROKERS: kafka:29092
      PORT: "3001"
    depends_on:
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    # Payments isolated to its own network segment + main net
    networks: [app_net, payments_net]
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://payments:payments_secret@postgres-payments:5432/payments_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      RUST_LOG: info
    depends_on:
      postgres-payments:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    networks: [app_net]
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      MODEL_PATH: /app/models
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_core_data:
  postgres_payments_data:
  redis_data:
  opensearch_data:
